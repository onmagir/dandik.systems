<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b5b5b"/>
    </marker>
  </defs>

  <!-- output h -->
  <rect x="60" y="18" width="430" height="26" rx="4" fill="#f2d98a" stroke="#c9ab54" stroke-width="1.5"/>
  <text x="42" y="36" font-size="17" font-style="italic" fill="#333">h</text>

  <!-- merge -->
  <circle cx="275" cy="82" r="15" fill="none" stroke="#5b5b5b" stroke-width="1.5"/>
  <text x="275" y="88" font-size="18" text-anchor="middle" fill="#5b5b5b">+</text>
  <line x1="275" y1="67" x2="275" y2="48" stroke="#5b5b5b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- frozen pretrained weights -->
  <rect x="75" y="150" width="150" height="140" rx="4" fill="#5d8ac4" stroke="#3f6b9e" stroke-width="1.5"/>
  <text x="150" y="205" font-size="15" text-anchor="middle" fill="#fff">Pretrained</text>
  <text x="150" y="226" font-size="15" text-anchor="middle" fill="#fff">Weights</text>
  <text x="150" y="256" font-size="15" text-anchor="middle" fill="#fff" font-style="italic">W &#8712; &#8477;</text>
  <text x="196" y="250" font-size="11" fill="#fff" font-style="italic">d&#215;d</text>

  <!-- B : r -> d -->
  <path d="M 320 140 L 480 140 L 425 205 L 375 205 Z" fill="#e08a4c" stroke="#b96a30" stroke-width="1.5"/>
  <text x="400" y="172" font-size="15" text-anchor="middle" fill="#fff" font-style="italic">B = 0</text>

  <!-- rank bottleneck -->
  <line x1="375" y1="216" x2="425" y2="216" stroke="#5b5b5b" stroke-width="1.2"/>
  <text x="400" y="233" font-size="13" text-anchor="middle" fill="#444" font-style="italic">r</text>

  <!-- A : d -> r -->
  <path d="M 375 240 L 425 240 L 480 305 L 320 305 Z" fill="#e08a4c" stroke="#b96a30" stroke-width="1.5"/>
  <text x="400" y="288" font-size="15" text-anchor="middle" fill="#fff" font-style="italic">A = &#119977;(0, &#963;&#178;)</text>

  <!-- d label -->
  <line x1="320" y1="320" x2="480" y2="320" stroke="#5b5b5b" stroke-width="1.2"/>
  <text x="400" y="337" font-size="13" text-anchor="middle" fill="#444" font-style="italic">d</text>

  <!-- input x -->
  <rect x="60" y="360" width="430" height="26" rx="4" fill="#f2d98a" stroke="#c9ab54" stroke-width="1.5"/>
  <text x="42" y="378" font-size="17" font-style="italic" fill="#333">x</text>

  <!-- input splits -->
  <line x1="150" y1="360" x2="150" y2="296" stroke="#5b5b5b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="400" y1="360" x2="400" y2="311" stroke="#5b5b5b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- paths to merge -->
  <line x1="150" y1="150" x2="262" y2="93" stroke="#5b5b5b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="400" y1="140" x2="288" y2="93" stroke="#5b5b5b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- legend -->
  <text x="150" y="120" font-size="12" text-anchor="middle" fill="#666">frozen</text>
  <text x="400" y="120" font-size="12" text-anchor="middle" fill="#666">trainable</text>
</svg>
